openapi: 3.0.0
info:
  title: Q&A API
  version: 1.0.0
paths:
  /ask:
    post:
      summary: Ask a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  example: "What is ROS2?"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        url:
                          type: string
                  matched_text_chunks:
                    type: array
                    items:
                      type: string
        '400':
          description: Bad request
        '500':
          description: Internal server error
